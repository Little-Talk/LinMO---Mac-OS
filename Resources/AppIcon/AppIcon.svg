<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC24B"/>
      <stop offset="0.48" stop-color="#FF6A5C"/>
      <stop offset="1" stop-color="#7B3FE4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2F45"/>
      <stop offset="1" stop-color="#151827"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F5FA"/>
      <stop offset="1" stop-color="#D9DCE8"/>
    </linearGradient>
    <linearGradient id="prompt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7CFFC4"/>
      <stop offset="1" stop-color="#2FD6A0"/>
    </linearGradient>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.32"/>
    </filter>
    <filter id="winShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#2B0A4A" flood-opacity="0.45"/>
    </filter>
    <clipPath id="winClip">
      <rect x="222" y="262" width="580" height="500" rx="56"/>
    </clipPath>
  </defs>

  <g filter="url(#tileShadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <g filter="url(#winShadow)">
    <rect x="222" y="262" width="580" height="500" rx="56" fill="url(#win)"/>
  </g>
  <g clip-path="url(#winClip)">
    <rect x="222" y="262" width="580" height="96" fill="url(#bar)"/>
    <rect x="222" y="356" width="580" height="2" fill="#000" fill-opacity="0.18"/>
    <circle cx="282" cy="310" r="17" fill="#FF5F57"/>
    <circle cx="336" cy="310" r="17" fill="#FEBC2E"/>
    <circle cx="390" cy="310" r="17" fill="#28C840"/>
  </g>
  <rect x="223.5" y="263.5" width="577" height="497" rx="54.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="3"/>

  <path d="M318 462 L420 540 L318 618" fill="none" stroke="url(#prompt)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="470" y="592" width="168" height="44" rx="22" fill="#F4F5FA"/>
</svg>
